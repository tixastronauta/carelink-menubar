# Builds CareLink Menubar (release variant) and publishes it as a GitHub release:
# - CareLink-Menubar.dmg (+ .sha256) for new installs;
# - CareLink-Menubar.zip and appcast.xml for in-app updates (Sparkle). Both are signed with the
#   EdDSA key in the SPARKLE_ED_PRIVATE_KEY secret; installed apps reject anything else.
# - Push a tag like v0.3.3 to publish a release. The tag must match the app version, and
#   docs/HISTORY.md must have a "## <version>" section (it becomes the update notes).
# - "Run workflow" (workflow_dispatch) only builds and uploads the DMG as an artifact, for testing.
#
# Signing: without secrets the app is ad-hoc signed and the desktop widget is left out (it needs a
# Team ID). To include the widget, add an Apple Development or Developer ID certificate as the
# repository secrets SIGNING_CERT_P12 (base64 of the .p12) and SIGNING_CERT_PASSWORD.
# Builds are not notarized: users approve the first launch in System Settings (see the notes).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        # Older Swift compilers give up type-checking some SwiftUI views ("unable to type-check
        # this expression in reasonable time"); the newest toolchain matches local builds.
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcrun swiftc --version

      - name: Import signing certificate (optional)
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "No signing certificate configured: ad-hoc build without the desktop widget."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: python3 tools/build-menubar.py --release

      - name: Package disk image
        run: ./tools/make-dmg.sh

      - name: Package and sign the in-app update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set: installed apps could not verify this update."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          built=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "build/CareLink Menubar.app/Contents/Info.plist")
          if [ "$built" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $built (tools/build-menubar.py)."
            exit 1
          fi
          # The secret must be the private half of the app's SUPublicEDKey, or installed apps would
          # reject this update. Compare public keys (the private key is never printed).
          expected=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "build/CareLink Menubar.app/Contents/Info.plist")
          derived=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | xcrun swift tools/sparkle-public-key.swift)
          if [ "$derived" != "$expected" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY does not match SUPublicEDKey ($expected)."
            exit 1
          fi
          sign_update="$(ls -d build/deps/Sparkle-*/bin/sign_update | head -1)"
          ditto -c -k --sequesterRsrc --keepParent "build/CareLink Menubar.app" build/CareLink-Menubar.zip
          signed=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - build/CareLink-Menubar.zip)
          python3 tools/appcast.py --version "$version" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/CareLink-Menubar.zip" \
            --sign-output "$signed" --history docs/HISTORY.md > build/appcast.xml
          # Sign the feed itself (the app sets SURequireSignedFeed), then check both signatures.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - build/appcast.xml
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - --verify build/appcast.xml
          grep -q "sparkle-signatures" build/appcast.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareLink-Menubar
          path: |
            build/CareLink-Menubar.dmg
            build/CareLink-Menubar.dmg.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/CareLink-Menubar.dmg build/CareLink-Menubar.dmg.sha256 \
            build/CareLink-Menubar.zip build/appcast.xml \
            --title "CareLink Menubar ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
