# Builds CareLink Menubar and publishes CareLink-Menubar.dmg as a GitHub release.
# - Push a tag like v0.3.1 to publish a release.
# - "Run workflow" (workflow_dispatch) only builds and uploads the DMG as an artifact, for testing.
#
# Signing: without secrets the app is ad-hoc signed and the desktop widget is left out (it needs a
# Team ID). To include the widget, add an Apple Development or Developer ID certificate as the
# repository secrets SIGNING_CERT_P12 (base64 of the .p12) and SIGNING_CERT_PASSWORD.
# Builds are not notarized: users approve the first launch in System Settings (see the notes).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate (optional)
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "No signing certificate configured: ad-hoc build without the desktop widget."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: python3 tools/build-menubar.py

      - name: Package disk image
        run: ./tools/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareLink-Menubar
          path: |
            build/CareLink-Menubar.dmg
            build/CareLink-Menubar.dmg.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/CareLink-Menubar.dmg build/CareLink-Menubar.dmg.sha256 \
            --title "CareLink Menubar ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
